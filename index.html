<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault - Multi Security Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. USER LOGIN SCREEN -->
    <div class="glass-card" id="lockScreen">
        <svg class="shield-icon" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        <h2 id="lockTitle">MEMBER LOGIN</h2>
        <div class="subtitle" id="lockSubtitle">Enter username and password to log in</div>

        <!-- Login Form -->
        <div id="loginUserFields">
            <input type="text" id="loginUsername" placeholder="Username...">
            <input type="password" id="loginPassword" placeholder="Password...">
            <button class="btn" onclick="loginUser()">LOGIN</button>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD SCREEN -->
    <div class="dashboard" id="dashboardScreen">
        <h2>⚡ CYBERVAULT CLOUD ⚡</h2>
        
        <!-- ACTION BUTTONS BAR -->
        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="togglePanel('settingsPanel')">⚙️ BOT CONFIG</button>
            <button class="btn btn-secondary" onclick="togglePanel('accountPanel')">👤 CHANGE LOGIN</button>
        </div>

        <!-- 1. BOT CONFIG PANEL -->
        <div class="panel" id="settingsPanel">
            <h3>⚙️ TELEGRAM BOT SETTINGS</h3>
            <label class="file-upload-label">Telegram Bot Token:</label>
            <input type="password" id="botTokenInput" placeholder="Enter Bot Token here...">
            
            <label class="file-upload-label">Telegram Chat ID:</label>
            <input type="text" id="chatIdInput" placeholder="Enter Chat ID here...">
            
            <button class="btn" onclick="saveBotConfig()">SAVE BOT CONFIG</button>
        </div>

        <!-- 2. CHANGE LOGIN CREDENTIALS PANEL -->
        <div class="panel" id="accountPanel">
            <h3>👤 CHANGE USERNAME & PASSWORD</h3>
            <label class="file-upload-label">Current Password:</label>
            <input type="password" id="currPassInput" placeholder="Confirm current password...">
            
            <label class="file-upload-label">New Username:</label>
            <input type="text" id="newUserInput" placeholder="Enter new username...">
            
            <label class="file-upload-label">New Password:</label>
            <input type="password" id="newPassInput" placeholder="Enter new password...">
            
            <button class="btn" onclick="updateCredentials()">UPDATE LOGIN INFO</button>
        </div>

        <!-- DATA UPLOAD PANEL -->
        <div class="panel">
            <h3>Upload Data & Files</h3>
            <label class="file-upload-label">Secret Note or Text:</label>
            <textarea id="vaultContent" rows="3" placeholder="Type information here..."></textarea>
            
            <label class="file-upload-label">Attach Media or File:</label>
            
            <!-- STYLISH FILE UPLOAD DROP-ZONE -->
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()" id="dropZone">
                <svg class="drop-zone-icon" viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
                <div class="drop-zone-text">Drag & drop files here or <strong>browse</strong></div>
                <div class="drop-zone-subtext">Supports images, videos, or any file type</div>
                <div class="selected-file-name" id="fileNameDisplay"></div>
            </div>
            
            <input type="file" id="fileInput" accept="image/*,video/*,*/*" style="display: none;" onchange="handleFileSelect(this)">
            
            <button class="btn" onclick="saveToTelegram()">SEND TO CLOUD</button>
        </div>

        <!-- VAULT DATA DISPLAY -->
        <div class="panel">
            <h3>
                Saved Data 
                <span class="sync-badge" id="syncStatus">AUTO SYNC ACTIVE</span>
            </h3>
            <div id="vaultList">Loading data...</div>
            <button class="btn btn-danger" onclick="logout()">BYE JAN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
